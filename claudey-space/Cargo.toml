[package]
name = "claudey-space"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "claudey-space"
path = "src/main.rs"

[dependencies]
egui = "0.34"
eframe = { version = "0.34", default-features = false, features = [
    "default_fonts",
    "wgpu",
] }
egui_term = { path = "vendor/egui_term" }
log = "0.4"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["gif", "png"] }

[profile.release]
opt-level = 3
lto = true
strip = true
